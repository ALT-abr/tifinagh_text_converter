<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>
        Tifinagh Converter
    </title>
</head>
<body>
    <header> 
        <section class="logo">
            <img src="static/images/z.png" alt="logo tifinagh" class="logo-img"> 
            <h1 class="logo-title">
                Latin → Tifinagh
            </h1>
        </section>
    </header>

    <main>
        <section class="container">
            <section class="form block">
                <h2 class="form-title subtitle">
                    Entrez votre texte en alphabet
                </h2>
                    
                <form method="POST">        
                    <textarea name="message" class="text-box"></textarea>    

                    <button type="submit">      
                        Convertir       
                    </button>       
                </form>
            </section>

            <section class="result block">
                <h2 class="result-title subtitle">
                    resultat de la conversion
                </h2>

                <section class="result_container text-box">
                    <p>
                        {{ resultat }}
                    </p>
                </section>
                
            </section>
        </section>
    </main>
</body>
</html>
